name: ci-skip-guard

# pull_request_target runs with a token that can write and can read secrets, so this workflow never executes code from the pull request. It checks out the base commit only, and the pull request head is fetched as git objects (data) so its commit messages can be read.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ci-skip-guard-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ci-skip-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          cache: pnpm
      # Base lockfile, no lifecycle scripts.
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Fetch the pull request commits as data
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: git fetch --no-tags origin "refs/pull/${PR_NUMBER}/head"
      - name: Fail on CI skip tokens in the pull request commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: pnpm run check:ci-skip --from "$BASE_SHA" --to "$HEAD_SHA"
